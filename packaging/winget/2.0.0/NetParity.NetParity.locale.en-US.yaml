ShortDescription: "See why it lagged: CPU, RAM, network, ping and jitter in one glance"
Description: |-
  NetParity is a tiny always-on-top overlay that shows CPU, RAM, network throughput, ping, jitter and packet loss at a glance.

  Bandwidth does not predict stutter. A 4K video will not drop frames on a fast connection when ping and jitter are stable, and a laggy game will not be fixed by more bandwidth when round-trip time is swinging. NetParity shows all of them together so the cause of a stutter is visible immediately, without alt-tabbing away from whatever you were doing.

  CPU and RAM are sampled four times a second, throughput continuously, and latency once a second using ICMP with a TCP-handshake fallback when ICMP is filtered.

  Everything is computed locally. The only network traffic is the ping probe to the target you configure, and turning the latency display off stops those probes entirely.
